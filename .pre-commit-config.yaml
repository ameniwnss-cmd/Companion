# Install once:  uv tool install pre-commit  &&  pre-commit install
# Run manually:  pre-commit run --all-files
# The same checks run in CI, so a green commit locally means a green pipeline.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  # Local hooks reuse the project's own pinned tool versions (uv.lock / package-lock.json),
  # so pre-commit and CI can never disagree about versions.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --directory backend ruff check --fix
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --directory backend ruff format
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy --strict (backend)
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: prettier
        name: prettier (frontend)
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|html)$
        pass_filenames: false
